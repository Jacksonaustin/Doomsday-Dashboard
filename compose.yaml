
services:
  frontend:
    build: ./client
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "5050"
      NODE_ENV: ${NODE_ENV:-development}
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      - ai
    restart: unless-stopped

  ai:
    build: ./ml-recommend
    restart: unless-stopped

  # Optional local database, for running without MongoDB Atlas:
  #   set MONGO_URI=mongodb://mongo:27017/doomsday in backend/.env, then
  #   docker compose --profile local-db up -d --build
  mongo:
    # Exact version: mongo 8.0 and newer images refuse to start on Docker Desktop's
    # Linux kernel 7.0.x (SERVER-121912). 8.2.12 runs.
    image: mongo:8.2.12
    profiles: ["local-db"]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
